<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>和文モールス</title>
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="和文モールス">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>:root { --bg:#000; --fg:#e8e8e8; --dim:#8a8a8a; --line:#2a2a2a; --panel:#0e0e0e; --y:#ffd400; --ok:#37d67a; --ng:#ff5a5a; }
* { box-sizing: border-box; }
html, body { margin:0; background:var(--bg); color:var(--fg); font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif; font-size:20px; }
#app { max-width:1000px; margin:0 auto; padding:28px 24px 48px; }
h1 { font-size:38px; margin:0 0 8px; letter-spacing:.08em; color:var(--y); }
h2 { margin:0; font-size:28px; font-weight:600; }
.lead { color:var(--dim); margin:0 0 20px; }
button, select, input { font:inherit; color:inherit; }
button { cursor:pointer; }
button:disabled { cursor:default; }
button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid var(--y); outline-offset:2px; }
.topbar { display:flex; align-items:center; gap:20px; margin-bottom:24px; }
.back { background:none; border:1px solid var(--line); border-radius:10px; padding:10px 16px; }
.back:hover { border-color:var(--y); }
.menu { display:grid; gap:12px; }
.menu-btn { display:flex; flex-direction:column; align-items:flex-start; gap:4px; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 22px; }
.menu-btn:hover:not(:disabled) { border-color:var(--y); }
.menu-btn:disabled { opacity:.4; }
.menu-label { font-size:26px; }
.menu-hint { color:var(--dim); font-size:17px; }
.chips { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:24px; }
.chip { background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:10px 20px; }
.chip[aria-pressed="true"] { border-color:var(--y); color:var(--y); }
/* 黄色い円：大きさ・形は変えない。点灯＝塗りつぶし、消灯＝ほぼ黒 */
.lamp { border-radius:50%; background:#16130a; border:2px solid #2a2410; }
.lamp.on { background:var(--y); border-color:var(--y); box-shadow:0 0 60px 10px rgba(255,212,0,.55); }
.lamp-large { width:240px; height:240px; }
.lamp-small { width:120px; height:120px; }
.lamp-wrap { display:flex; justify-content:center; padding:16px; }
.stage { min-height:340px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
.prompt-char { font-size:120px; line-height:1.1; color:var(--y); }
.prompt-sub { color:var(--dim); min-height:1.2em; }
.prompt-code { font-size:64px; letter-spacing:.15em; color:var(--y); }
.choices { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin:12px 0; }
.choice { display:flex; align-items:center; gap:16px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px 22px; font-size:28px; text-align:left; }
.choice:hover:not(:disabled) { border-color:var(--y); }
.choice .key { color:var(--dim); font-size:18px; border:1px solid var(--line); border-radius:6px; padding:2px 9px; }
.choice.right { border-color:var(--ok); background:#07210f; }
.choice.wrong { border-color:var(--ng); background:#260a0a; }
.feedback { min-height:2.4em; font-size:26px; margin-top:8px; }
.feedback.ok strong { color:var(--ok); }
.feedback.ng strong { color:var(--ng); }
.score { text-align:right; color:var(--dim); }
.primary { background:var(--y); color:#000; border:none; border-radius:12px; padding:16px 28px; font-weight:700; }
.secondary { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 22px; }
.next { display:block; margin:12px auto 0; }
.next[hidden] { display:none; }
.list-layout { display:grid; grid-template-columns:1fr 300px; gap:24px; }
.search { width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
.rows { display:grid; gap:8px; }
.row { display:grid; grid-template-columns:160px 1fr auto; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 18px; text-align:left; }
.row:hover { border-color:var(--y); }
.row-char { font-size:28px; }
.row-code { font-size:26px; letter-spacing:.12em; color:var(--y); }
.row-play { color:var(--dim); font-size:16px; }
.list-right { position:sticky; top:16px; align-self:start; text-align:center; }
.detail { color:var(--dim); }
.detail-char { font-size:44px; color:var(--fg); }
.detail-code { font-size:30px; color:var(--y); letter-spacing:.12em; }
.empty { color:var(--dim); }
.settings { display:grid; gap:18px; }
.set-row { display:grid; grid-template-columns:240px 1fr 120px; align-items:center; gap:16px; }
.set-label { color:var(--dim); }
.set-value { text-align:right; }
.toggle { background:var(--panel); border:2px solid var(--y); color:var(--y); border-radius:12px; padding:12px 18px; text-align:left; grid-column:2 / span 2; }
.toggle.off { border-color:var(--line); color:var(--dim); }
select { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; }
input[type=range] { width:100%; accent-color:var(--y); }
.set-test { display:flex; align-items:center; gap:24px; }
.note { color:var(--dim); font-size:17px; line-height:1.7; }
@media (max-width:820px) { .list-layout { grid-template-columns:1fr; } .choices { grid-template-columns:1fr; } .set-row { grid-template-columns:1fr; } }

/* テスト */
.bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin-bottom:8px; }
.bar-fill { height:100%; width:0; background:var(--y); transition:width .15s; }
.choice.picked { border-color:var(--y); }
.start { display:block; margin:28px 0 0; font-size:24px; }
.result-score { margin:8px 0 24px; font-size:26px; }
.result-score .big { font-size:64px; color:var(--y); font-weight:700; }
h3 { font-size:22px; margin:24px 0 10px; }
.wrong-list { display:grid; gap:8px; }
.wrong-row { display:grid; grid-template-columns:48px 1fr 1fr; gap:12px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 16px; }
.wrong-no { color:var(--dim); }
.wrong-answer { color:var(--ok); }
.wrong-chosen { color:var(--ng); }
.weak { font-size:24px; line-height:1.8; }
.result-actions { display:flex; gap:16px; margin-top:28px; flex-wrap:wrap; }
@media (max-width:820px) { .wrong-row { grid-template-columns:1fr; } }

/* Phase 2：記録・苦手文字・復習 */
.kind-tag { text-align:center; color:var(--dim); font-size:18px; min-height:24px; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; margin:12px 0 8px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 20px; }
.card h3 { margin:0 0 8px; color:var(--y); font-size:20px; }
.card-line { font-size:20px; line-height:1.7; }
.stat-list { display:grid; gap:6px; margin:8px 0 16px; }
.stat-row { display:grid; grid-template-columns:minmax(120px,1.2fr) 80px 1fr; gap:12px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 16px; font-size:20px; }
.stat-head { background:transparent; border:none; color:var(--dim); font-size:16px; padding-top:0; padding-bottom:0; }
.stat-char { font-size:26px; }
.weak-row .stat-rate { color:var(--ng); }
.stat-detail { color:var(--dim); font-size:17px; }
.day-row { display:grid; grid-template-columns:130px repeat(5,1fr); gap:8px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 16px; font-size:19px; }
.day-row.stat-head { background:transparent; border:none; font-size:16px; padding-top:0; padding-bottom:0; }
.all-stats { margin:16px 0; }
.all-stats summary { cursor:pointer; font-size:20px; padding:10px 0; color:var(--dim); }
.empty { color:var(--dim); font-size:20px; margin:20px 0; }
.danger { background:#3a0d0d; color:#ff8a8a; border:1px solid #7a2222; border-radius:12px; padding:12px 20px; font-size:18px; cursor:pointer; }
.danger:hover { background:#4d1111; }
.confirm { margin:12px 0; }
.confirm p { font-size:19px; line-height:1.6; }
.backup-msg { font-size:18px; min-height:24px; }
.backup-msg.ok { color:var(--ok); }
.backup-msg.ng { color:var(--ng); }
@media (max-width:820px) { .stat-row { grid-template-columns:1fr 60px; } .stat-detail { grid-column:1 / -1; } .day-row { grid-template-columns:110px repeat(5,1fr); font-size:16px; padding:8px; } }

/* Phase 3：学習する・入力式・ランク・グラフ */
.learn-card { display:grid; grid-template-columns:1fr auto; align-items:center; gap:24px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:20px 32px; margin:12px 0 20px; }
.learn-text { display:flex; flex-direction:column; align-items:flex-start; gap:8px; }
.learn-text .prompt-char { font-size:128px; }
.sym-row { display:flex; align-items:center; gap:14px; height:36px; }
.sym { display:inline-block; height:24px; background:#3a3210; border-radius:12px; transition:background .05s; }
.sym.dot { width:24px; }
.sym.dash { width:72px; }
.sym.lit { background:var(--y); box-shadow:0 0 18px 2px rgba(255,212,0,.5); }
.learn-text .prompt-code { font-size:40px; }
@media (max-width:820px) { .learn-card { grid-template-columns:1fr; } }
.answer-panel { display:grid; gap:14px; max-width:640px; margin:0 auto; }
.choices.input-mode { display:block; }
.auto-answer { display:flex; gap:10px; align-items:center; margin-top:10px; font-size:16px; color:var(--dim, var(--fg)); }
.auto-answer input { width:22px; height:22px; flex:none; }
.check-pass .lead { color:var(--ok); font-weight:bold; }
.check-fail .lead { color:var(--ng); font-weight:bold; }
.menu-btn:disabled { opacity:.45; cursor:not-allowed; }
.text-answer { font-size:36px; padding:14px 18px; background:var(--panel); color:var(--fg); border:2px solid var(--line); border-radius:14px; width:100%; }
.text-answer:focus { border-color:var(--y); }
.text-answer.right { border-color:var(--ok); background:#07210f; }
.text-answer.wrong { border-color:var(--ng); background:#260a0a; }
.morse-entry { min-height:84px; font-size:52px; letter-spacing:.2em; text-align:center; color:var(--y); background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:12px; display:flex; align-items:center; justify-content:center; }
.morse-entry.empty { font-size:22px; letter-spacing:0; color:var(--dim); }
.morse-entry.right { border-color:var(--ok); }
.morse-entry.wrong { border-color:var(--ng); }
.morse-keys { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.morse-key { font-size:32px; padding:22px; background:var(--panel); border:2px solid var(--line); border-radius:14px; }
.morse-key:hover:not(:disabled) { border-color:var(--y); }
.morse-actions { display:grid; grid-template-columns:1fr 2fr; gap:14px; }
.bonus { color:var(--y); font-size:22px; text-align:center; min-height:0; margin-top:6px; }
.gain { color:var(--y); }
.given { color:var(--dim); }
.game-header { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin:4px 0 22px; }
.gh-block { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 18px; }
.gh-top { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:8px; }
.gh-big { font-size:24px; color:var(--y); }
.gh-sub { color:var(--dim); font-size:16px; }
.gh-sub.done { color:var(--ok); }
.meter { height:10px; background:var(--line); border-radius:5px; overflow:hidden; }
.meter-fill { height:100%; background:var(--y); border-radius:5px; }
.meter.done .meter-fill { background:var(--ok); }
@media (max-width:820px) { .game-header { grid-template-columns:1fr; } }
.charts { display:grid; gap:18px; margin:8px 0 20px; }
.chart { margin:0; position:relative; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px 8px; }
.chart figcaption { font-size:18px; color:var(--fg); margin-bottom:4px; }
.chart-svg { width:100%; height:auto; display:block; }
.chart .grid-line { stroke:#1f1f1f; stroke-width:1; }
.chart .axis-line { stroke:#3a3a3a; stroke-width:1; }
.chart .axis-text { fill:var(--dim); font-size:13px; }
.chart .goal-line { stroke:#9a9a9a; stroke-width:1.5; stroke-dasharray:6 5; }
.chart .goal-text { fill:#b5b5b5; font-size:13px; }
.chart .bar { fill:var(--y); }
.chart .bar.active { fill:#fff1a8; }
.chart .line { fill:none; stroke:var(--y); stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
.chart .dot { fill:var(--y); stroke:var(--panel); stroke-width:2; }
.chart .dot.hidden { display:none; }
.chart .dot.active { display:inline; fill:#fff1a8; }
.chart .crosshair { stroke:#6a6a6a; stroke-width:1; stroke-dasharray:3 3; }
.chart .hit { fill:transparent; }
.chart-tip { position:absolute; top:44px; transform:translateX(-50%); background:#1b1b1b; border:1px solid #444; border-radius:8px; padding:6px 12px; font-size:15px; white-space:nowrap; pointer-events:none; z-index:2; }
.chart .goal-note { color:var(--dim); font-size:15px; }

/* 表から選ぶ */
.choices.table-mode { display:block; }
.answer-table { display:grid; gap:6px; max-width:620px; margin:0 auto; }
.table-row { display:grid; grid-template-columns:64px repeat(5, 1fr); gap:6px; align-items:stretch; }
.table-label { color:var(--dim); font-size:15px; display:flex; align-items:center; }
.table-gap { min-height:1px; }
.table-cell { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:56px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:4px 2px; }
.table-cell:hover:not(:disabled) { border-color:var(--y); background:#16130a; }
.cell-char { font-size:28px; line-height:1.1; }
.cell-name { font-size:11px; color:var(--dim); }
.table-cell.right { border-color:var(--ok); background:#07210f; }
.table-cell.wrong { border-color:var(--ng); background:#260a0a; }
.table-cell.picked { border-color:var(--y); }

/* スマホ・小さい画面 */
button, a, input, select { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
select, input[type="text"], input[type="search"] { max-width:100%; }
.set-row > * { min-width:0; }
.set-row select { width:100%; }
@supports (padding: max(0px)) {
  #app { padding-left:max(24px, env(safe-area-inset-left)); padding-right:max(24px, env(safe-area-inset-right)); padding-bottom:max(48px, env(safe-area-inset-bottom)); }
}
@media (max-width:600px) {
  html, body { font-size:18px; }
  #app { padding:16px 14px 40px; }
  h1 { font-size:30px; }
  h2 { font-size:22px; line-height:1.25; }
  .topbar { gap:12px; margin-bottom:16px; }
  .back { white-space:nowrap; padding:10px 12px; flex:none; }
  .topbar h2 { min-width:0; }
  .lamp-large { width:168px; height:168px; }
  .lamp-wrap { padding:8px; }
  .stage { min-height:0; padding:6px 0 10px; }
  .prompt-char { font-size:92px; }
  .prompt-code { font-size:40px; }
  .choice { font-size:24px; padding:16px 16px; }
  .learn-card { padding:14px 16px; gap:8px; }
  .learn-text .prompt-char { font-size:96px; }
  .sym-row { gap:8px; flex-wrap:nowrap; }
  .sym.dot { width:16px; height:16px; }
  .sym.dash { width:44px; height:16px; }
  .learn-text { min-width:0; max-width:100%; }
  .menu-btn { padding:14px 16px; }
  .chip { padding:9px 14px; }
  .result-score .big { font-size:48px; }
  .wrong-row { padding:10px 12px; }
  .morse-entry { font-size:40px; }
  .morse-key { font-size:26px; padding:18px; }
  .text-answer { font-size:28px; }
  .game-header { gap:10px; }
  .chart { padding:10px 10px 4px; }
}

.text-backup { margin:14px 0; }
.text-backup summary { cursor:pointer; color:var(--dim); font-size:18px; padding:8px 0; }
.backup-text { width:100%; background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:15px; font-family:ui-monospace,Consolas,monospace; }

/* 音だけで答える問題（円を出さない）／警告 */
.listen-only { display:flex; flex-direction:column; align-items:center; gap:8px; padding:24px 0; color:var(--dim, var(--fg)); }
.listen-icon { font-size:96px; line-height:1; color:var(--accent, #ffd400); opacity:.85; }
.warn { color:var(--ng, #ff6b6b); font-weight:bold; margin:10px 0; }
.warn:empty { display:none; }

/* ---- 整理：メニュー・選択画面・設定・問題画面 ---- */
.group-title { font-size:15px; letter-spacing:.12em; color:var(--dim); margin:20px 0 8px; font-weight:normal; }
.menu-section .group-title { margin-top:16px; }
.menu.tiles { grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:10px; }
.menu.tiles .menu-btn { padding:14px 16px; }
.menu.tiles .menu-label { font-size:22px; }
.menu.tiles .menu-hint { font-size:14px; }
.menu.compact { gap:8px; margin-bottom:8px; }
.menu.compact .menu-btn { padding:12px 16px; }
.menu.compact .menu-label { font-size:20px; }
.menu.compact .menu-hint { font-size:14px; }
.next-step { display:flex; flex-direction:column; align-items:flex-start; gap:4px; width:100%; text-align:left; padding:16px 20px; margin:0 0 6px; border-radius:14px; }
.ns-label { font-size:22px; font-weight:700; }
.ns-hint { font-size:14px; font-weight:400; opacity:.8; }
.game-header { margin:4px 0 14px; gap:12px; }
.ctl-group { margin-bottom:14px; }
.ctl-group .chips { margin-bottom:8px; }
.chip-note { margin:0 0 4px; font-size:14px; }
.set-sub { color:var(--dim); font-size:14px; margin:6px 0 4px; }
.sticky-start { position:sticky; bottom:0; margin-top:8px; padding:12px 0 max(10px, env(safe-area-inset-bottom, 0px)); background:linear-gradient(to top, var(--bg) 70%, rgba(0,0,0,0)); }
.sticky-start .start { width:100%; }
.set-group { border:1px solid var(--line); border-radius:14px; padding:2px 16px; margin-bottom:12px; background:var(--panel); }
.set-group > summary { cursor:pointer; font-size:20px; padding:12px 0; }
.set-group[open] > summary { border-bottom:1px solid var(--line); margin-bottom:14px; }
.set-group .settings { padding-bottom:12px; }
@media (max-width:600px) {
  .menu.tiles { grid-template-columns:1fr 1fr; }
  .menu.tiles .menu-label { font-size:19px; }
  .menu.tiles .menu-hint { font-size:13px; }
  .game-header { grid-template-columns:1fr 1fr; gap:8px; }
  .gh-block { padding:10px 12px; }
  .gh-big { font-size:20px; }
  .gh-sub { font-size:12px; }
  .gh-top { margin-bottom:6px; }
  .next-step { padding:14px 16px; }
  .ns-label { font-size:19px; }
  /* 問題の画面：答えの選択肢と「次の問題」が、スクロールなしで見えるように */
  .lamp-large { width:140px; height:140px; }
  .listen-icon { font-size:64px; }
  .listen-only { padding:6px 0; }
  .feedback { font-size:20px; min-height:2em; }
  .choice { padding:13px 16px; font-size:22px; }
  .choices { gap:10px; margin:8px 0; }
}
@media (max-width:600px) {
  .menu.tiles .menu-btn:last-child:nth-child(odd) { grid-column:1 / -1; }
  .chip { font-size:16px; padding:8px 13px; }
  .chips { gap:8px; margin-bottom:14px; }
}

/* ---- 問題の画面：「正解！」と「次の問題」を同じ行に ---- */
.fb-row { display:flex; align-items:center; gap:12px; min-height:2.4em; margin-top:8px; }
.fb-row .feedback { flex:1 1 auto; min-width:0; margin:0; min-height:0; }
.fb-row .next { flex:none; margin:0; padding:12px 20px; }
.fb-row .next[hidden] { display:none; }
.feedback .given { display:block; font-size:.7em; }
.qwrap { display:flex; flex-direction:column; }
.qwrap > * { flex:none; }

/* スマホ：問題の画面を、スクロールなしで1画面に収める */
@media (max-width:600px) {
  #app:has(.qwrap) { padding:8px 12px max(8px, env(safe-area-inset-bottom, 0px)); }
  .qwrap { min-height:calc(100vh - 16px); min-height:calc(100dvh - 16px); }
  .qwrap .topbar { margin-bottom:6px; gap:10px; }
  .qwrap .topbar h2 { font-size:18px; }
  .qwrap .back { padding:6px 10px; font-size:16px; }

          h("div", { class: "topbar" }, h("button", { class: "back", onclick: () => ctx.go(menuScreen) }, "\u2190 \u30E1\u30CB\u30E5\u30FC"), h("h2", {}, "\u66F8\u304D\u53D6\u308A\u306E\u7B54\u3048")),
          h("p", { class: "lead" }, `\u6253\u3063\u305F ${total} \u6587\u5B57\u306E\u7B54\u3048\u3067\u3059\u3002\u66F8\u304D\u53D6\u3063\u305F\u3082\u306E\u3068\u898B\u6BD4\u3079\u3066\u304F\u3060\u3055\u3044\u3002`),
          h("div", { class: "dict-grid" }, ...entries.map(cell)),
          h(
            "div",
            { class: "result-actions" },
            h("button", { class: "primary", onclick: () => {
              player.prime();
              ctx.go(dictationRunScreen(buildDictation(data, pool), pool));
            } }, "\u65B0\u3057\u3044\u6587\u5B57\u3067\u3082\u3046\u4E00\u5EA6"),
            h("button", { class: "secondary", onclick: () => {
              player.prime();
              ctx.go(dictationRunScreen(entries, pool));
            } }, "\u540C\u3058\u6587\u5B57\u3092\u3082\u3046\u4E00\u5EA6"),
            h("button", { class: "secondary", onclick: () => ctx.go(dictationSetupScreen) }, "\u7BC4\u56F2\u3092\u5909\u3048\u308B")
          )
        );
      };
      root.append(
        h("div", { class: "topbar" }, h("button", { class: "back", onclick: () => ctx.go(dictationSetupScreen) }, "\u2190 \u3084\u3081\u308B"), h("h2", {}, "\u66F8\u304D\u53D6\u308A\u7DF4\u7FD2")),
        progress,
        h("div", { class: "bar" }, fill),
        h("div", { class: "stage dict-stage" }, lamp.el, status),
        h("div", { class: "result-actions dict-actions" }, pauseBtn, quitBtn)
      );
      countdown(0);
      return () => {
        document.removeEventListener("visibilitychange", onHide);
        clearTimers();
        player.stop();
        player.detach(lamp.indicator);
      };
    };
  }

  // src/renderer/screens/menu.ts
  var menuScreen = (root, ctx) => {
    const reviewCount = ctx.records.review.length;
    const weakCount = weakChars(ctx.records, ctx.data).length;
    const sections = [
      {
        title: "\u899A\u3048\u308B",
        items: [
          { label: "\u5B66\u7FD2\u3059\u308B", hint: "\u884C\u3054\u3068\u306B\u898B\u3066\u899A\u3048\u3001\u78BA\u8A8D\u30C6\u30B9\u30C8\u3078", screen: learnScreen },
          { label: "\u30E2\u30FC\u30EB\u30B9\u4FE1\u53F7\u4E00\u89A7", hint: "\u5168\u6587\u5B57\u306E\u7B26\u53F7\u3092\u898B\u308B\u30FB\u805E\u304F\u30FB\u63A2\u3059", screen: listScreen }
        ]
      },
      {
        title: "\u7DF4\u7FD2\u3059\u308B",
        items: [
          { label: "\u7DF4\u7FD2\u554F\u984C", hint: "\u6587\u5B57\u30FB\u7B26\u53F7\u30FB\u97F3\u30FB\u5186\u306E\u554F\u984C\u3092\u89E3\u304F", screen: practiceScreen },
          {
            label: "\u9593\u9055\u3048\u305F\u554F\u984C\u3092\u5FA9\u7FD2",
            hint: reviewCount > 0 ? `\u5FA9\u7FD2\u3059\u308B\u554F\u984C\uFF1A${reviewCount}\u554F` : "\u9593\u9055\u3048\u305F\u554F\u984C\u304C\u305F\u307E\u308B\u3068\u4F7F\u3048\u307E\u3059",
            screen: reviewCount > 0 ? reviewScreen : void 0
          },
          { label: "\u66F8\u304D\u53D6\u308A\u7DF4\u7FD2", hint: "50\u6587\u5B57\u3092\u7D9A\u3051\u3066\u6253\u3061\u3001\u6700\u5F8C\u306B\u7B54\u3048\u3092\u4E00\u89A7\u3067\u898B\u308B", screen: dictationSetupScreen },
          { label: "\u82E6\u624B\u306A\u6587\u5B57", hint: weakCount > 0 ? `\u82E6\u624B\u306A\u6587\u5B57\uFF1A${weakCount}\u6587\u5B57` : "\u9593\u9055\u3048\u3084\u3059\u3044\u6587\u5B57\u3092\u7DF4\u7FD2", screen: weakScreen }
        ]
      },
      {
        title: "\u529B\u3060\u3081\u3057",
        items: [{ label: "\u30C6\u30B9\u30C8", hint: "10\u301C100\u554F\u3092\u7D9A\u3051\u3066\u89E3\u304D\u3001\u6700\u5F8C\u306B\u7B54\u3048\u5408\u308F\u305B", screen: examSetupScreen }]
      },
      {
        title: "\u8A18\u9332\u30FB\u8A2D\u5B9A",
        items: [
          { label: "\u5B66\u7FD2\u8A18\u9332", hint: "\u65E5\u3054\u3068\u306E\u6210\u7E3E\u30FB\u5B66\u7FD2\u6642\u9593", screen: recordsScreen },
          { label: "\u8A2D\u5B9A", hint: "\u97F3\u30FB\u901F\u3055\u30FB\u6587\u5B57\u306E\u8868\u793A\u30FB\u30D0\u30C3\u30AF\u30A2\u30C3\u30D7", screen: settingsScreen }
        ]
      }
    ];
    const nextIdx = LEARN_GROUPS.findIndex((g) => !ctx.records.learned.includes(g.id));
    const nextStep = nextIdx >= 0 ? { label: `\u3064\u304E\u306F\u3053\u308C\uFF1A${LEARN_GROUPS[nextIdx].title}\u3092\u5B66\u7FD2\u3059\u308B`, hint: "\u898B\u3066\u899A\u3048\u305F\u3089\u3001\u6700\u5F8C\u306E\u78BA\u8A8D\u30C6\u30B9\u30C8\u306B\u5408\u683C\u3057\u3066\u6B21\u306E\u884C\u3078", go: () => ctx.go(learnGroupScreen(LEARN_GROUPS[nextIdx])) } : { label: "\u3064\u304E\u306F\u3053\u308C\uFF1A\u7DF4\u7FD2\u554F\u984C", hint: "\u5168\u90E8\u306E\u884C\u306B\u5408\u683C\u3057\u307E\u3057\u305F\u3002\u3044\u308D\u3044\u308D\u306A\u554F\u984C\u3067\u529B\u3092\u3064\u3051\u307E\u3057\u3087\u3046", go: () => ctx.go(practiceScreen) };
    root.append(
      h("h1", {}, "\u548C\u6587\u30E2\u30FC\u30EB\u30B9"),
      gameHeader(ctx),
      h(
        "button",
        { class: "next-step primary", onclick: nextStep.go },
        h("span", { class: "ns-label" }, nextStep.label),
        h("span", { class: "ns-hint" }, nextStep.hint)
      ),
      ...sections.map(
        (sec) => h(
          "section",
          { class: "menu-section" },
          h("h3", { class: "group-title" }, sec.title),
          h(
            "div",
            { class: "menu tiles" },
            ...sec.items.map((it) => {
              const s = it.screen;
              return h(
                "button",
                { class: "menu-btn", disabled: !s, onclick: () => s && ctx.go(s) },
                h("span", { class: "menu-label" }, it.label),
                h("span", { class: "menu-hint" }, it.hint)
              );
            })
          )
        )
      )
    );
  };

  // src/renderer/app.ts
  async function main() {
    const root = document.getElementById("app");
    let data;
    try {
      data = new MorseData(await window.api.loadMorseData());
    } catch (e) {
      root.textContent = `\u7B26\u53F7\u30C7\u30FC\u30BF\u3092\u8AAD\u307F\u8FBC\u3081\u307E\u305B\u3093\uFF1A${e instanceof Error ? e.message : String(e)}`;
      return;
    }
    const storedSettings = await window.api.loadStore("settings");
    const settings = sanitizeSettings(storedSettings);
    const hasChoice = !!storedSettings && typeof storedSettings === "object" && "autoAnswer" in storedSettings;
    if (!hasChoice && window.matchMedia?.("(pointer: coarse)").matches) settings.autoAnswer = true;
    const records = sanitizeRecords(await window.api.loadStore("records"), (id) => !!data.get(id));
    const player = new Player();
    const tracker = new ActivityTracker();
    let studying = false;
    const saveRecords = () => void window.api.saveStore("records", records);
    const flush = () => {
      const now = Date.now();
      addStudySeconds(records, dateKey(new Date(now)), tracker.take(now));
      saveRecords();
    };
    const touch = () => tracker.touch(Date.now());
    document.addEventListener("pointerdown", touch, true);
    document.addEventListener("keydown", touch, true);
    window.addEventListener("pagehide", () => {
      if (studying) flush();
    });
    let cleanup;
    const ctx = {
      data,
      settings,
      player,
      go(screen) {
        cleanup?.();
        root.replaceChildren();
        cleanup = screen(root, ctx);
      },
      records,
      logAnswer(q, correct, opts = {}) {
        const now = Date.now();
        tracker.touch(now);
        const outcome = recordAnswer(records, {
          targetId: q.target.id,
          kind: q.kind,
          correct,
          now,
          inReview: opts.inReview,
          streak: opts.streak,
          input: opts.input,
          dailyGoal: settings.dailyGoal
        });
        flush();
        return outcome;
      },
      study() {
        tracker.start(Date.now());
        studying = true;
        return () => {
          tracker.stop(Date.now());
          studying = false;
          flush();
        };
      },
      markLearned(groupId) {
        if (!records.learned.includes(groupId)) records.learned.push(groupId);
        saveRecords();
      },
      replaceRecords(next) {
        records.chars = next.chars;
        records.days = next.days;
        records.review = next.review;
        records.game = next.game;
        records.learned = next.learned;
        saveRecords();
      },
      saveSettings: () => window.api.saveStore("settings", settings),
      applySettings() {
        player.soundOn = settings.soundOn;
        player.volume = settings.volume;
        player.pitchHz = settings.pitchHz;
      }
    };
    ctx.applySettings();
    ctx.go(menuScreen);
  }
  void main();

  // src/renderer/pwa.ts
  var secure = location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1";
  if ("serviceWorker" in navigator && secure) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {
      });
    });
  }
})();
</script>
